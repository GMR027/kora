[package]
name = "kora-neutts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kora-neutts"
path = "src/main.rs"

[dependencies]
anyhow = "1"
hound = "3.5"
ogg = "0.9"
opus = "0.4"
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["openmp"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", features = ["ndarray"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
