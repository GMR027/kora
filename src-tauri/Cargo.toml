[package]
name = "kora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lector EPUB/PDF local-first con TTS y sincronización LAN"
default-run = "kora"

[lib]
name = "kora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kora"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
epub.workspace = true
lopdf.workspace = true
mdns-sd.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
yrs.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Necesario para los builds de producción: el CLI activa esta feature cuando
# embebe el frontend en lugar de usar el dev server.
custom-protocol = ["tauri/custom-protocol"]
