name: Linux desktop

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake git clang libclang-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libssl-dev librsvg2-dev patchelf libasound2-dev \
            tesseract-ocr libtesseract-dev libleptonica-dev \
            tesseract-ocr-spa tesseract-ocr-eng \
            espeak-ng libespeak-ng-dev libopus-dev ffmpeg

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build neutts helper
        run: pnpm build:helper

      - name: Frontend check and build
        run: |
          pnpm check
          pnpm build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
