[workspace]
members = ["src-tauri", "src-tauri/neutts-helper"]
exclude = ["src-tauri/vendor/piper-rs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Kora contributors"]

[workspace.dependencies]
ab_glyph = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hkdf = "0.12"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
spake2 = "0.4"
ammonia = "4.2"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
lopdf = "0.47"
mdns-sd = "0.22"
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rbook = "0.7.13"
regex = "1.13"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
imageproc = { version = "0.27", default-features = false, features = ["text"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29", features = ["serde", "v4", "v7"] }
yrs = "0.28"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
